<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Vehicles | Mega City Cab</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div th:replace="~{fragments/nav :: header('vehicles')}"></div>
    <main class="wide">
        <div class="card">
            <a class="back-link" th:href="@{/}">&larr; Home</a>
            <h2 class="page-title">Vehicles</h2>
            <p class="page-lead">The current fleet available for booking.</p>

            <div class="alert-success" th:if="${successMessage}" th:text="${successMessage}"></div>

            <p><a th:href="@{/vehicles/new}" class="btn-primary btn-auto">+ Add vehicle</a></p>

            <table class="data-table" th:if="${!vehicles.isEmpty()}">
                <thead>
                <tr>
                    <th>Registration</th>
                    <th>Make / model</th>
                    <th>Type</th>
                    <th>Seats</th>
                    <th>Daily rate</th>
                    <th>Status</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="vehicle : ${vehicles}">
                    <td th:text="${vehicle.registrationNo}"></td>
                    <td th:text="${vehicle.make} + ' ' + ${vehicle.model}"></td>
                    <td th:text="${vehicle.type}"></td>
                    <td th:text="${vehicle.seatingCapacity}"></td>
                    <td th:text="${vehicle.dailyRate}"></td>
                    <td><span class="badge" th:text="${vehicle.status}"></span></td>
                </tr>
                </tbody>
            </table>

            <div class="empty-state" th:if="${vehicles.isEmpty()}">
                <p>No vehicles registered yet.</p>
            </div>
        </div>
    </main>
</body>
</html>
