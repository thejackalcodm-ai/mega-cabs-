<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Register | Mega City Cab</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div th:replace="~{fragments/nav :: header('register')}"></div>
    <main>
        <div class="card">
            <a class="back-link" th:href="@{/}">&larr; Home</a>
            <h2 class="page-title">Customer Registration</h2>
            <p class="page-lead">Create your account to start booking rides.</p>

            <div class="alert-error" th:if="${errorMessage}" th:text="${errorMessage}"></div>

            <form th:action="@{/register}" th:object="${customerRegistrationRequest}" method="post" novalidate="novalidate">
                <div class="field" th:classappend="${#fields.hasErrors('name')} ? 'has-error'">
                    <label for="name">Full name</label>
                    <input type="text" id="name" th:field="*{name}" placeholder="e.g. Nimal Perera" autocomplete="name"/>
                    <div class="field-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                </div>

                <div class="field" th:classappend="${#fields.hasErrors('address')} ? 'has-error'">
                    <label for="address">Address</label>
                    <input type="text" id="address" th:field="*{address}" placeholder="e.g. 12 Galle Road, Colombo" autocomplete="street-address"/>
                    <div class="field-error" th:if="${#fields.hasErrors('address')}" th:errors="*{address}"></div>
                </div>

                <div class="field" th:classappend="${#fields.hasErrors('nic')} ? 'has-error'">
                    <label for="nic">NIC (National Identity Card)</label>
                    <input type="text" id="nic" th:field="*{nic}" placeholder="982761234V"/>
                    <div class="field-hint" th:unless="${#fields.hasErrors('nic')}">
                        Old format: 9 digits + V or X (e.g. 982761234V). New format: 12 digits.
                    </div>
                    <div class="field-error" th:if="${#fields.hasErrors('nic')}" th:errors="*{nic}"></div>
                </div>

                <div class="field" th:classappend="${#fields.hasErrors('username')} ? 'has-error'">
                    <label for="username">Username</label>
                    <input type="text" id="username" th:field="*{username}" placeholder="Choose a username" autocomplete="username"/>
                    <div class="field-error" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></div>
                </div>

                <div class="field" th:classappend="${#fields.hasErrors('password')} ? 'has-error'">
                    <label for="password">Password</label>
                    <input type="password" id="password" th:field="*{password}" placeholder="At least 6 characters" autocomplete="new-password"/>
                    <div class="field-hint" th:unless="${#fields.hasErrors('password')}">
                        Must be at least 6 characters.
                    </div>
                    <div class="field-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
                </div>

                <button type="submit" class="btn-primary">Create account</button>
            </form>
        </div>
    </main>
</body>
</html>
