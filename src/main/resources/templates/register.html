<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Register | Mega City Cab</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <header class="site-header">
        <div class="brand">
            <span class="brand-mark">MCC</span>
            <h1>Mega City Cab</h1>
        </div>
    </header>
    <main>
        <div class="card">
            <a class="back-link" th:href="@{/}">&larr; Home</a>
            <h2 class="page-title">Customer Registration</h2>

            <div class="alert-error" th:if="${errorMessage}" th:text="${errorMessage}"></div>

            <form th:action="@{/register}" th:object="${customerRegistrationRequest}" method="post">
                <div class="field">
                    <label for="name">Full name</label>
                    <input type="text" id="name" th:field="*{name}"/>
                    <div class="field-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                </div>

                <div class="field">
                    <label for="address">Address</label>
                    <input type="text" id="address" th:field="*{address}"/>
                    <div class="field-error" th:if="${#fields.hasErrors('address')}" th:errors="*{address}"></div>
                </div>

                <div class="field">
                    <label for="nic">NIC</label>
                    <input type="text" id="nic" th:field="*{nic}" placeholder="e.g. 982761234V"/>
                    <div class="field-error" th:if="${#fields.hasErrors('nic')}" th:errors="*{nic}"></div>
                </div>

                <div class="field">
                    <label for="username">Username</label>
                    <input type="text" id="username" th:field="*{username}"/>
                    <div class="field-error" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></div>
                </div>

                <div class="field">
                    <label for="password">Password</label>
                    <input type="password" id="password" th:field="*{password}"/>
                    <div class="field-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
                </div>

                <button type="submit" class="btn-primary">Register</button>
            </form>
        </div>
    </main>
</body>
</html>
