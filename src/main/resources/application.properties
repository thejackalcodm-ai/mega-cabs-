# Mega City Cab - Online Vehicle Reservation System
# Default (development) configuration.
#
# Database credentials are intentionally NOT hard-coded for any profile
# other than the local H2 file database, which requires none. Any future
# MySQL/PostgreSQL deployment profile must read credentials from
# environment variables / GitHub Secrets - see README "Configuration".

spring.application.name=mega-city-cab

# Embedded, file-based H2 database so the project runs with zero external
# setup for marking/demonstration purposes. File mode (not in-memory) is
# used so data persists between application restarts.
spring.datasource.url=jdbc:h2:file:./data/megacitycab;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 web console - development/demonstration only, disabled by default.
spring.h2.console.enabled=false

# Render (and most PaaS hosts) inject PORT at runtime; default to 8080 locally.
server.port=${PORT:8080}
